<input id="name" placeholder="Medicine name">
<input id="batch" placeholder="Batch number">
<input id="expiry" type="date">
<input id="qty" type="number" placeholder="Quantity">
<input id="mrp" type="number" placeholder="MRP">

<button onclick="addMedicine()">Add Medicine</button>

<div class="card">

<input id="search" oninput="showMedicines()" placeholder="🔎 Search medicine">

</div>

<div class="card">

<p>Total Sales: ₹<b id="salesTotal">0</b></p>
<p>Total Bills: <b id="billCount">0</b></p>
</div>

</div>

<script>

let medicines =
JSON.parse(localStorage.getItem("medicines")) || [];

let cart = [];

let sales =
JSON.parse(localStorage.getItem("sales")) || [];

function saveMedicines(){
localStorage.setItem("medicines",JSON.stringify(medicines));
}

function saveSales(){
localStorage.setItem("sales",JSON.stringify(sales));
}

function addMedicine(){

let name=document.getElementById("name").value.trim();
let batch=document.getElementById("batch").value.trim();
let expiry=document.getElementById("expiry").value;
let qty=Number(document.getElementById("qty").value);
let mrp=Number(document.getElementById("mrp").value);
let purchase=Number(document.getElementById("purchase").value);

if(!name || !batch || !expiry || qty<=0 || mrp<=0){
alert("Please fill all required details");
return;
}

medicines.push({
id:Date.now(),
name:name,
batch:batch,
expiry:expiry,
qty:qty,
mrp:mrp,
purchase:purchase
});

saveMedicines();

document.getElementById("name").value="";
document.getElementById("batch").value="";
document.getElementById("expiry").value="";
document.getElementById("qty").value="";
document.getElementById("mrp").value="";
document.getElementById("purchase").value="";

showMedicines();
updateMedicineSelect();
showAlerts();
alert("Medicine added successfully!");
}

function deleteMedicine(id){

if(!confirm("Delete this medicine?")) return;

medicines=medicines.filter(m=>m.id!==id);

saveMedicines();
showMedicines();
updateMedicineSelect();
}

function showMedicines(){

let search=document.getElementById("search").value.toLowerCase();
let box=document.getElementById("inventory");

box.innerHTML="";

let filtered=medicines.filter(m =>
m.name.toLowerCase().includes(search)

box.innerHTML="<p>No medicines found.</p>";
return;
}

filtered.forEach(m=>{

box.innerHTML+=`

onclick="deleteMedicine(${m.id})">
Delete

});
